<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — NOVA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><div id="site-header"></div><main class="page auth-page"><div class="auth-art"><img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Smartphone from the sample NOVA technology catalogue"><div><p class="eyebrow">WELCOME TO NOVA</p><h2>Make room<br><em>for what’s next.</em></h2></div></div><section class="auth-panel"><nav class="breadcrumb"><a href="index.html">Home</a><span>›</span><span>Create account</span></nav><p class="eyebrow">DEMO ACCOUNT</p><h1>Create your <em>NOVA ID.</em></h1><p class="muted">Save a sample profile and keep your tech shortlist close.</p><form id="register-form" class="form-card auth-form"><label>Your name<input required name="name" autocomplete="name"></label><label>Email address<input required type="email" name="email" autocomplete="email"></label><label>Password<div class="password-field"><input required type="password" name="password" minlength="8" autocomplete="new-password"><button type="button" class="password-toggle" aria-label="Show password">Show</button></div></label><label class="checkbox-label terms-label"><input type="checkbox" name="terms" required> I understand this is a demo profile, not secure authentication.</label><button class="button" type="submit">Create demo account <span aria-hidden="true">↗</span></button><p id="register-message" class="muted small" aria-live="polite"></p><p class="demo-note">Your password is only used for client-side form validation and is never stored.</p></form><p class="auth-bottom">Already have a demo profile? <a href="login.html">Log in ↗</a></p></section></main><div id="site-footer"></div><script src="app.js"></script></body></html>
